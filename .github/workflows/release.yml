# Auto-build + GitHub Release on a version bump.
#
# Fires when a push to main changes the gradle file that carries the version.
# The version itself is the guard: if the tag v<versionName> already exists we
# skip (the file changed but the version did not), otherwise we build, sign,
# tag, and publish a Release with the APKs attached.
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64  - `base64 -w0 your-release.jks`
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
# Without those secrets the job still runs and attaches the *unsigned* APKs.
name: Release

on:
  push:
    branches: [ main ]
    paths:
      - 'app/build.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: write        # create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to tell whether this version is new

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then echo "versionName not found"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Skip if this version was already released
        id: guard
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.ver.outputs.tag }} exists — nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.guard.outputs.new == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release (ABI splits)
        if: steps.guard.outputs.new == 'true'
        run: ./gradlew :app:assembleRelease

      - name: Sign APKs
        if: steps.guard.outputs.new == 'true' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            signed="${apk/-unsigned/}"
            "$BUILD_TOOLS/zipalign" -f 4 "$apk" "$signed"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              "$signed"
            rm -f "$apk" "$apk.idsig"
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        if: steps.guard.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MatChat ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
